name: Autonomous Worker

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Approved repository owner/name"
        required: true
        default: "ALNAHMI711/Ahmed-Alnahmi-711"
      task:
        description: "Inspection task"
        required: true
        default: "Inspect repository and report blockers"
      write_mode:
        description: "Worker permission mode"
        required: true
        type: choice
        options:
          - read_only
          - propose_changes
        default: read_only
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: autonomous-worker
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout control hub
        uses: actions/checkout@v4

      - name: Guard sensitive operations
        run: |
          set -euo pipefail
          echo "LIVE trading, withdrawals, secret rotation, production deployment,"
          echo "and destructive operations are outside this worker's authority."

      - name: Enforce task policy
        env:
          TARGET_REPO: ${{ inputs.target_repo || 'ALNAHMI711/Ahmed-Alnahmi-711' }}
          TASK: ${{ inputs.task || 'Inspect repository and report blockers' }}
        run: ./worker/policy.sh

      - name: Inspect approved target
        env:
          TARGET_REPO: ${{ inputs.target_repo || 'ALNAHMI711/Ahmed-Alnahmi-711' }}
          TASK: ${{ inputs.task || 'Inspect repository and report blockers' }}
        run: ./worker/inspect.sh

      - name: Run safe tests
        env:
          TARGET_REPO: ${{ inputs.target_repo || 'ALNAHMI711/Ahmed-Alnahmi-711' }}
          TASK: ${{ inputs.task || 'Inspect repository and report blockers' }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/$TARGET_REPO.git" "$RUNNER_TEMP/test-target"
          ./worker/test.sh "$RUNNER_TEMP/test-target"

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-inspection-report
          path: inspection-report.md

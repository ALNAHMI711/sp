name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r deploy/control-api/requirements.txt
      - name: Compile project Python
        run: python -m compileall -q app worker tests
      - name: Run project tests
        run: python -m pytest -q tests

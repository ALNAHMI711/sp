name: Unified Dev Hub CI
on:
  push:
    paths:
      - "unified-dev-hub/**"
      - ".github/workflows/unified-dev-hub-ci.yml"
  pull_request:
    paths:
      - "unified-dev-hub/**"
      - ".github/workflows/unified-dev-hub-ci.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unified-dev-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: unified-dev-hub/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Upload application source as downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: unified-dev-hub-source
          path: |
            unified-dev-hub/**
            !unified-dev-hub/tests/*.db*
            !unified-dev-hub/**/__pycache__/**
            !unified-dev-hub/**/.pytest_cache/**
            !unified-dev-hub/.env
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

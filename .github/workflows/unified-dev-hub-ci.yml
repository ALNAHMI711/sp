name: Unified Dev Hub CI
on:
  push:
    paths:
      - "unified-dev-hub/**"
      - ".github/workflows/unified-dev-hub-ci.yml"
  pull_request:
    paths:
      - "unified-dev-hub/**"
      - ".github/workflows/unified-dev-hub-ci.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unified-dev-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: unified-dev-hub/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Package application
        run: zip -r unified-dev-hub.zip . -x ".env" "tests/*.db*" "*.pyc" "*/__pycache__/*" ".pytest_cache/*" "unified-dev-hub.zip"
      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: unified-dev-hub
          path: unified-dev-hub/unified-dev-hub.zip
          if-no-files-found: error
          retention-days: 14

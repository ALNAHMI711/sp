name: Control Hub CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install -r deploy/control-api/requirements.txt
      - name: Compile Python
        run: python -m compileall -q worker tests
      - name: Run tests
        run: python -m pytest -q tests

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: controlhub_test
          POSTGRES_USER: controlhub
          POSTGRES_PASSWORD: controlhub
        options: >-
          --health-cmd "pg_isready -U controlhub -d controlhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r deploy/control-api/requirements.txt
      - name: Run PostgreSQL integration tests
        env:
          CONTROL_POSTGRES_DSN: postgresql://controlhub:controlhub@localhost:5432/controlhub_test
        run: python -m pytest -q tests/test_postgres_queue.py

name: Autonomous Worker V2
on:
  push:
    paths:
      - ".github/workflows/autonomous-worker-v2.yml"
  workflow_dispatch:
    inputs:
      target_repo:
        description: Approved repository
        required: true
        default: ALNAHMI711/sp
        type: string
      task:
        description: Safe task description
        required: true
        default: Inspect repository and report blockers
        type: string
      write_mode:
        description: Execution mode
        required: true
        default: read_only
        type: choice
        options: [read_only, propose_changes]
      run_openhands:
        description: Run configured OpenHands Agent Server
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 */2 * * *"
permissions:
  contents: read
concurrency:
  group: autonomous-worker-v2
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_REPO: ${{ inputs.target_repo || 'ALNAHMI711/sp' }}
      TASK: ${{ inputs.task || 'Inspect repository and report blockers' }}
      WRITE_MODE: ${{ inputs.write_mode || 'read_only' }}
      RUN_OPENHANDS: ${{ inputs.run_openhands || false }}
    steps:
      - name: Checkout control hub
        uses: actions/checkout@v4
      - name: Enforce task policy
        run: bash worker/policy.sh
      - name: Inspect target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/test-target"
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$TARGET_REPO.git" "$RUNNER_TEMP/test-target"
          TARGET_REPO="$TARGET_REPO" TASK="$TASK" TARGET_CLONE_URL="https://x-access-token:$GH_TOKEN@github.com/$TARGET_REPO.git" bash worker/inspect.sh
      - name: Run safe tests
        run: bash worker/test.sh "$RUNNER_TEMP/test-target"
      - name: Completion gate
        if: always()
        env:
          OPENHANDS_STATUS: not_requested
        run: bash worker/completion.sh "$RUNNER_TEMP/test-target"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-worker-v2-reports
          path: |
            inspection-report.md
            completion-report.md
            test-report.md
          if-no-files-found: ignore

name: Unified Dev Hub CI
on:
  push:
    paths:
      - "unified-dev-hub/**"
  pull_request:
    paths:
      - "unified-dev-hub/**"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unified-dev-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: unified-dev-hub/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

services:
  - type: web
    name: unified-dev-hub
    runtime: docker
    dockerfilePath: ./unified-dev-hub/Dockerfile
    dockerContext: ./unified-dev-hub
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /data/projects.db
    disk:
      name: unified-dev-hub-data
      mountPath: /data
      sizeGB: 1

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controlhub}
      POSTGRES_USER: ${POSTGRES_USER:-controlhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: deploy/control-api/Dockerfile
    restart: "no"
    environment:
      CONTROL_POSTGRES_DSN: ${CONTROL_POSTGRES_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "/app/deploy/migrate_postgres.py"]

  control-api:
    build:
      context: ..
      dockerfile: deploy/control-api/Dockerfile
    restart: unless-stopped
    environment:
      CONTROL_QUEUE_DB: /app/data/control-queue.sqlite3
      CONTROL_JWT_SECRET: ${CONTROL_JWT_SECRET:?set CONTROL_JWT_SECRET in environment}
      CONTROL_ADMIN_USERNAME: ${CONTROL_ADMIN_USERNAME:?set CONTROL_ADMIN_USERNAME in environment}
      CONTROL_ADMIN_PASSWORD: ${CONTROL_ADMIN_PASSWORD:?set CONTROL_ADMIN_PASSWORD in environment}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in environment}
      CONTROL_ALLOWED_REPOS: ${CONTROL_ALLOWED_REPOS:-ALNAHMI711/sp}
      CONTROL_KILL_SWITCH_FILE: /app/data/KILL_SWITCH
      CONTROL_QUEUE_BACKEND: ${CONTROL_QUEUE_BACKEND:-sqlite}
      CONTROL_POSTGRES_DSN: ${CONTROL_POSTGRES_DSN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - control-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  reaper:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - ./worker.env
    environment:
      CONTROL_QUEUE_DB: /app/data/control-queue.sqlite3
      CONTROL_QUEUE_BACKEND: ${CONTROL_QUEUE_BACKEND:-sqlite}
      CONTROL_POSTGRES_DSN: ${CONTROL_POSTGRES_DSN:-}
      CONTROL_REAPER_INTERVAL_SECONDS: ${CONTROL_REAPER_INTERVAL_SECONDS:-15}
    volumes:
      - control-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - ./worker.env
    environment:
      CONTROL_QUEUE_DB: /app/data/control-queue.sqlite3
      CONTROL_KILL_SWITCH_FILE: /app/data/KILL_SWITCH
      CONTROL_QUEUE_BACKEND: ${CONTROL_QUEUE_BACKEND:-sqlite}
      CONTROL_POSTGRES_DSN: ${CONTROL_POSTGRES_DSN:-}
    volumes:
      - control-data:/app/data
      - worker-workspaces:/app/workspaces
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      control-api:
        condition: service_healthy

volumes:
  postgres-data:
  control-data:
  worker-workspaces:
